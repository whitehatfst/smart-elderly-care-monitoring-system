<!DOCTYPE html>
<html lang="en">
<head>
    <meta http-equiv="content-type" content="text/html; charset=UTF-8">
    <meta charset="utf-8">
    <title>工作人员统计分析</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
    <meta name="description" content="">
    <meta name="author" content="">
    <!-- STYLESHEETS --><!--[if lt IE 9]><script src="js/flot/excanvas.min.js"></script><script src="http://html5shiv.googlecode.com/svn/trunk/html5.js"></script><script src="http://css3-mediaqueries-js.googlecode.com/svn/trunk/css3-mediaqueries.js"></script><![endif]-->
    <link rel="stylesheet" type="text/css" href="css/cloud-admin.css">
    <link rel="stylesheet" type="text/css" href="css/themes/default.css" id="skin-switcher">
    <link rel="stylesheet" type="text/css" href="css/responsive.css">
    <link href="font-awesome/css/font-awesome.min.css" rel="stylesheet">
    <link rel="stylesheet" type="text/css" href="js/jquery-ui-1.10.3.custom/css/custom-theme/jquery-ui-1.10.3.custom.min.css">
    <link rel="stylesheet" type="text/css" href="js/bootstrap-daterangepicker/daterangepicker-bs3.css">
    <link href="font-awesome/fonts/open-sans.css" rel="stylesheet" type="text/css">
    <style>
        #employee-report-chart {
            width: 100%;
            height: 420px;
        }
    </style>
</head>
<body>
    {% include 'topbar.html' %}

    <section id="page">
        {% include 'leftsidebar.html' %}

        <div id="main-content">
            <div class="container">
                <div class="row">
                    <div id="content" class="col-lg-12">
                        <div class="row">
                            <div class="col-sm-12">
                                <div class="page-header">
                                    <ul class="breadcrumb">
                                        <li>
                                            <i class="fa fa-home"></i>
                                            <a href="/datamanage">主页</a>
                                        </li>
                                        <li>
                                            <a href="/employeeinfolist">工作人员信息管理</a>
                                        </li>
                                        <li>工作人员统计分析</li>
                                    </ul>
                                    <div class="clearfix">
                                        <h3 class="content-title pull-left">工作人员统计分析</h3>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div class="row">
                            <div class="col-md-12">
                                <div class="box border orange">
                                    <div class="box-title">
                                        <h4><i class="fa fa-signal"></i>人员离职/入职对比</h4>
                                        <div class="tools">
                                            <a href="/employeestatistic" class="reload">
                                                <i class="fa fa-refresh"></i>
                                            </a>
                                            <a href="javascript:;" class="collapse">
                                                <i class="fa fa-chevron-up"></i>
                                            </a>
                                            <a href="javascript:;" class="remove">
                                                <i class="fa fa-times"></i>
                                            </a>
                                        </div>
                                    </div>
                                    <div class="box-body">
                                        <div id="employee-report-chart"></div>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div class="footer-tools">
                            <span class="go-top">
                                <i class="fa fa-chevron-up"></i> Top
                            </span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <script src="js/jquery/jquery-2.0.3.min.js"></script>
    <script src="js/jquery-ui-1.10.3.custom/js/jquery-ui-1.10.3.custom.min.js"></script>
    <script src="bootstrap-dist/js/bootstrap.min.js"></script>
    <script src="js/bootstrap-daterangepicker/moment.min.js"></script>
    <script src="js/bootstrap-daterangepicker/daterangepicker.min.js"></script>
    <script type="text/javascript" src="js/jQuery-slimScroll-1.3.0/jquery.slimscroll.min.js"></script>
    <script type="text/javascript" src="js/jQuery-slimScroll-1.3.0/slimScrollHorizontal.min.js"></script>
    <script type="text/javascript" src="js/jQuery-BlockUI/jquery.blockUI.min.js"></script>
    <script type="text/javascript" src="js/jQuery-Cookie/jquery.cookie.min.js"></script>
    <script type="text/javascript" src="js/sparklines/jquery.sparkline.min.js"></script>
    <script type="text/javascript" src="js/echarts/echarts.min.js"></script>
    <script src="js/script.js"></script>
    <script>
        function getDefaultOption() {
            return {
                tooltip: {
                    trigger: 'axis',
                    axisPointer: {
                        type: 'cross',
                        label: {
                            backgroundColor: '#6a7985'
                        }
                    }
                },
                legend: {
                    data: ['离职人数', '入职人数']
                },
                toolbox: {
                    feature: {
                        saveAsImage: {}
                    }
                },
                grid: {
                    left: '3%',
                    right: '4%',
                    bottom: '3%',
                    containLabel: true
                },
                xAxis: [
                    {
                        type: 'category',
                        boundaryGap: false,
                        data: ['一月', '二月', '三月', '四月', '五月', '六月', '七月', '八月', '九月', '十月', '十一月', '十二月']
                    }
                ],
                yAxis: [
                    {
                        type: 'value',
                        minInterval: 1
                    }
                ],
                series: [
                    {
                        name: '离职人数',
                        type: 'line',
                        stack: '总量',
                        areaStyle: {normal: {}},
                        data: [2, 5, 1, 3, 0, 4, 2, 1, 0, 2, 1, 0]
                    },
                    {
                        name: '入职人数',
                        type: 'line',
                        stack: '总量',
                        label: {
                            normal: {
                                show: true,
                                position: 'top'
                            }
                        },
                        areaStyle: {normal: {}},
                        data: [5, 10, 3, 5, 2, 6, 10, 4, 3, 5, 2, 1]
                    }
                ]
            };
        }

        function loadEmployeeStatistic() {
            var chart = echarts.init(document.getElementById('employee-report-chart'));
            var option = getDefaultOption();

            chart.setOption(option);
            chart.showLoading();

            $.ajax({
                url: '/employeestatistic/compare',
                contentType: 'application/json;charset=UTF-8',
                cache: false,
                dataType: 'json',
                success: function(response) {
                    chart.hideLoading();
                    chart.setOption({
                        xAxis: [{
                            data: response.months || option.xAxis[0].data
                        }],
                        series: [
                            {data: response.resign || option.series[0].data},
                            {data: response.hire || option.series[1].data}
                        ]
                    });
                },
                error: function() {
                    chart.hideLoading();
                    chart.setOption(option);
                }
            });

            $(window).on('resize', function() {
                chart.resize();
            });
        }

        jQuery(document).ready(function() {
            App.setPage("index");
            App.init();
            loadEmployeeStatistic();
        });
    </script>
</body>
</html>
