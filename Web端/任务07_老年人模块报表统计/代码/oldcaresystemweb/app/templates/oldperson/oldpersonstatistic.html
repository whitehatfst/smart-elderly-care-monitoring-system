	<script>
		// 基于准备好的dom，初始化echarts实例



   function loadAgeChart(){
    	var myChart = echarts.init(document.getElementById('main'));

    	myChart.setOption({
    	color: ['#00FF99'],
    	tooltip : {
			trigger: 'axis',
			axisPointer : {            // 坐标轴指示器，坐标轴触发有效
				type : 'shadow'        // 默认为直线，可选为：'line' | 'shadow'
			 }
         },
        grid: {
			left: '3%',
			right: '4%',
			bottom: '3%',
			containLabel: true
         },
        xAxis : [
        	{
				type : 'category',
				data : [],
				axisTick: {
					alignWithLabel: true
				}
        	}
    	],
        yAxis : [
           {
              type : 'value',
               minInterval:1
           }
         ],
    series : [
        {
            name:'人数',
            type:'bar',
            barWidth: '60%',
            data:[]
        }
    ]
  });
  myChart.showLoading();

    var names = [];    //（实际用来盛放X轴坐标值）
    var nums = [];    //（实际用来盛放Y坐标值）

    $.ajax({
			url: '/oldpersonstatistic/age',
			contentType: 'application/json;charset=UTF-8',
			cache:false,
			dataType: 'json',
			success: function (response) {

				 $.each(response.list, function (index, item) {
                names.push(item.name);    //挨个取出类别并填入类别数组                    
                nums.push(item.num);    //挨个取出销量并填入销量数组
            });
                myChart.hideLoading();

                 myChart.setOption({        //加载数据图表
                xAxis: {
                    data: names
                },
                series: [{
                    data: nums
                }]
            });

			}
		});

  }

 function loadRelationshipChart(){
 	var chart2 = echarts.init(document.getElementById('main2'));

 	chart2.setOption({
    backgroundColor: '#FFFFFF',

    title : {
        text: '',
        subtext: '',
        x:'center'
    },
    legend: {
        orient: 'vertical',
        left: 'left',
        data: ['男','女']
    },

    tooltip : {
        trigger: 'item',
        formatter: "{a} <br/>{b} : {c} ({d}%)"
    },

    series : [
        {

            name:'监护人',
            type:'pie',
            radius : '55%',
            center: ['50%', '50%'],
            data:[
                {value:56, name:'儿子/女儿'},
                {value:45, name:'女婿/儿媳'},
                {value:20, name:'外甥/侄子'},
                {value:36, name:'配偶'},
                {value:15, name:'其他亲属'}
            ],
            itemStyle: {
                emphasis: {
                    shadowBlur: 10,
                    shadowOffsetX: 0,
                    shadowColor: 'rgba(0, 0, 0, 0.5)'
                }
            }
        }
    ]
  });
		 chart2.showLoading();

    $.ajax({
			url: '/oldpersonstatistic/relationship',
			contentType: 'application/json;charset=UTF-8',
			cache:false,
			dataType: 'json',
			success: function (response) {

                chart2.hideLoading();

                 chart2.setOption({        //加载数据图表
               
                series: [{
                    data: response.list
                }]
            });

			}
		});

}
