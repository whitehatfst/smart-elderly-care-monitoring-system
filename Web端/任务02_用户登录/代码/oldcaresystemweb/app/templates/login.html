<!DOCTYPE html>
<html lang="en">
<head>
	<title>管理员</title>
	<meta http-equiv="content-type" content="text/html; charset=UTF-8">
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
	<meta name="description" content="">
	<meta name="author" content="">

	<link rel="stylesheet" type="text/css" href="css/cloud-admin.css" >
	
	<link href="font-awesome/css/font-awesome.min.css" rel="stylesheet">
	<!-- DATE RANGE PICKER -->
	<link rel="stylesheet" type="text/css" href="js/bootstrap-daterangepicker/daterangepicker-bs3.css" />
	<!-- UNIFORM -->
	<link rel="stylesheet" type="text/css" href="js/uniform/css/uniform.default.min.css" />
	<!-- ANIMATE -->
	<link rel="stylesheet" type="text/css" href="css/animatecss/animate.min.css" />
	<!-- FONTS -->
	<link href='font-awesome/fonts/open-sans.css' rel='stylesheet' type='text/css'>
</head>
<body class="login">
<form action = "/login" method = "post">
	<!-- PAGE -->
	<section id="page">
			<!-- HEADER -->
			<header>
				<!-- NAV-BAR -->
				<div class="container">
					<div class="row">
						<div class="col-md-4 col-md-offset-4">
										<div id="logo">
										  <h3>基于情感分析的智慧养老系统</h3>
										</div>
						</div>
					</div>
				</div>
				<!--/NAV-BAR -->
			</header>
			<!--/HEADER -->
			<!-- LOGIN -->
			<section id="login" class="visible">
				<div class="container">
					<div class="row">
						<div class="col-md-4 col-md-offset-4">
							<div class="login-box-plain">
								{% for message in get_flashed_messages() %}
									<div class="alert alert-block alert-danger fade in">
												<p>{{ message }}</p>
									</div>
								{% endfor %}


								<div class="divide-40"></div>
								<form role="form">
								  <div class="form-group">
									<label for="exampleInputEmail1">邮箱地址</label>
									<i class="fa fa-envelope"></i>
									<input type="text" placeholder="请输入您的邮箱地址" class="form-control" name="email" id="exampleInputEmail1" >
								  </div>
								  <div class="form-group"> 
									<label for="exampleInputPassword1">登录密码</label>
									<i class="fa fa-lock"></i>
									<input type="password" placeholder="请输入您的密码" class="form-control" name="password" id="exampleInputPassword1" >
								  </div>
								  <div class="form-actions">
									<label class="checkbox"> <input type="checkbox" class="uniform" value=""> 保存密码</label>
									 <button type="submit" class="btn  btn-primary">登录</button>

								  </div>

								</form>

								<!-- /SOCIAL LOGIN -->

							</div>
						</div>
					</div>
				</div>
			</section>
			<!--/LOGIN -->
			<!-- FORGOT PASSWORD -->
			<section id="forgot">
				<div class="container">
					<div class="row">
						<div class="col-md-4 col-md-offset-4">
							<div class="login-box-plain">
								<h2 class="bigintro">重置密码</h2>
								<div class="divide-40"></div>
								<form role="form">
								  <div class="form-group">
									<label for="registInputEmail">输入你的邮箱地址</label>
									<i class="fa fa-envelope"></i>
									<input type="email" class="form-control" id="registInputEmail" >
								  </div>
								  <div class="form-actions">
									<button type="submit" class="btn btn-info">发送</button>
								  </div>
								</form>
								<div class="login-helpers">
									<a href="#" onclick="swapScreen('login');return false;">Back to Login</a> <br>
								</div>
							</div>
						</div>
					</div>
				</div>
			</section>
			<!-- FORGOT PASSWORD -->
	</section>
	<!--/PAGE -->
	<!-- JAVASCRIPTS -->
	<!-- Placed at the end of the document so the pages load faster -->
	<!-- JQUERY -->
	<script src="js/jquery/jquery-2.0.3.min.js"></script>
	<!-- JQUERY UI-->
	<script src="js/jquery-ui-1.10.3.custom/js/jquery-ui-1.10.3.custom.min.js"></script>
	<!-- BOOTSTRAP -->
	<script src="bootstrap-dist/js/bootstrap.min.js"></script>
	
	<!-- COOKIE -->
	<script type="text/javascript" src="js/jQuery-Cookie/jquery.cookie.min.js"></script>
	<!-- UNIFORM -->
	<script type="text/javascript" src="js/uniform/jquery.uniform.min.js"></script>
	<!-- CUSTOM SCRIPT -->
	<script src="js/script.js"></script>
	<script>
		jQuery(document).ready(function() {		
			App.setPage("login");  //Set current page
			App.init(); //Initialise plugins and elements
		});
	</script>
	<script type="text/javascript">
		function swapScreen(id) {
			jQuery('.visible').removeClass('visible animated fadeInUp');
			jQuery('#'+id).addClass('visible animated fadeInUp');
		}

		function validatepass(){
			var pwd = $("#registInputPassword1").val();
			var pwd1 = $("#exampleInputPassword2").val();

			if (pwd == pwd1)
			{
				$("#tishiid").html("两次密码相同");
         		$("#tishiid").css("color","green");
         		$("#registerid").removeAttr("disabled");
			}
			else
			{
				$("#tishiid").html("两次密码不一样");
         		$("#tishiid").css("color","red");
				$("#registerid").attr("disabled","disabled");
			}

		}
	</script>
	<!-- /JAVASCRIPTS -->
</form>
</body>
</html>
